name: Deploy to shinyapps.io

on:
  push:
    branches: [main]
    paths:              # only redeploy when the app itself changes
      - "app.R"
      - "R/04_database.R"
      - "R/10_alerts.R"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Write .Renviron from GitHub Secrets so it can be bundled in the deploy
      - name: Write .Renviron
        run: |
          cat > .Renviron << 'RENVIRON'
          SUPABASE_HOST=${{ secrets.SUPABASE_HOST }}
          SUPABASE_PORT=${{ secrets.SUPABASE_PORT }}
          SUPABASE_DB=${{ secrets.SUPABASE_DB }}
          SUPABASE_USER=${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD=${{ secrets.SUPABASE_PASSWORD }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          RESEND_FROM=${{ secrets.RESEND_FROM }}
          APP_URL=https://snemovnadnes.cz
          RENVIRON

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.2"

      - name: Install rsconnect
        run: Rscript -e 'install.packages("rsconnect")'

      - name: Deploy to shinyapps.io
  env:
    SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
    SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
  run: |
    Rscript -e '
      rsconnect::setAccountInfo(
        name   = "dopady",
        token  = Sys.getenv("SHINYAPPS_TOKEN"),
        secret = Sys.getenv("SHINYAPPS_SECRET")
      )
      rsconnect::deployApp(
        appDir   = ".",
        appName  = "snemovnadnes",
        account  = "dopady",
        server   = "shinyapps.io",
        appFiles = c("app.R", "secrets.R", "renv.lock",
                     "R/04_database.R", "R/10_alerts.R"),
        forceUpdate   = TRUE,
        launch.browser = FALSE
      )
    '

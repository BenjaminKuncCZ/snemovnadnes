name: Deploy to shinyapps.io

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'

      - name: Install system dependencies
        run: sudo apt-get install -y libcurl4-openssl-dev libssl-dev libpq-dev

      - name: Install R packages
        run: |
          install.packages(c(
            "shiny", "plotly", "DBI", "dplyr", "stringr",
            "RPostgres", "httr2", "jsonlite", "uuid", "rsconnect"
          ), repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - name: Deploy
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN:   ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET:  ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          rsconnect::setAccountInfo(
            name   = Sys.getenv("SHINYAPPS_ACCOUNT"),
            token  = Sys.getenv("SHINYAPPS_TOKEN"),
            secret = Sys.getenv("SHINYAPPS_SECRET")
          )
          rsconnect::deployApp(
            appDir      = ".",
            appName     = "snemovnadnes",
            account     = Sys.getenv("SHINYAPPS_ACCOUNT"),
            forceUpdate = TRUE,
            launch.browser = FALSE
          )
        shell: Rscript {0}
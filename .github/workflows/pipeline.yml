name: Daily pipeline

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = 07:00 Prague summer time
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libpoppler-cpp-dev \
            libpq-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.2"

      - uses: r-lib/actions/setup-r-dependencies@v2

      - name: Write .Renviron
        run: |
          cat > .Renviron << 'RENVIRON'
          SUPABASE_HOST=${{ secrets.SUPABASE_HOST }}
          SUPABASE_PORT=${{ secrets.SUPABASE_PORT }}
          SUPABASE_DB=${{ secrets.SUPABASE_DB }}
          SUPABASE_USER=${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD=${{ secrets.SUPABASE_PASSWORD }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          RESEND_FROM=${{ secrets.RESEND_FROM }}
          ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
          APP_URL=https://snemovnadnes.cz
          LLM_BACKEND=gemini
          RUN_PIPELINE=1
          RENVIRON

      - name: Create data directories
        run: mkdir -p data/pdfs data/stanoviska

      - name: Run pipeline
        env:
          SCHEDULED_ROOT: ${{ github.workspace }}   # <-- tells 07_scheduled_run.R where the project root is
        run: Rscript R/07_scheduled_run.R
